{"name": "bot", "on": {"schedule": [{"cron": "7 */5 * * *"}], "workflow_dispatch": null, "push": {"branches": ["main"]}}, "permissions": {"contents": "read", "actions": "write"}, "concurrency": {"group": "bot", "cancel-in-progress": false}, "jobs": {"run": {"runs-on": "ubuntu-latest", "timeout-minutes": 355, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}}, {"run": "pip install requests \"yt-dlp[default]\""}, {"name": "run bot", "env": {"BOT_TOKEN": "${{ secrets.BOT_TOKEN }}", "ADMIN_ID": "${{ secrets.ADMIN_ID }}", "RUN_SECONDS": "20400"}, "run": "python \"$(ls -1 *bot.py.txt | sort -V | tail -1)\""}, {"name": "chain next run", "if": "always()", "env": {"GH_TOKEN": "${{ github.token }}"}, "run": "gh workflow run bot.yml --repo ${{ github.repository }}"}]}}}
